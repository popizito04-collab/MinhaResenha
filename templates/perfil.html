```html
<!DOCTYPE html>
<htm
l lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - MinhaResenha</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='letterbox.css') }}">
</head>

<body>

    <header>

        <h1>🎬 MinhaResenha</h1>

        <nav>
            <a href="/filmes">Filmes</a>
            <a href="/resenhas">Resenhas</a>
            <a href="/perfil">Meu perfil</a>
            <a href="/logout">Sair</a>
        </nav>

    </header>


    <main>

        <h2>Meu perfil</h2>

        <div class="perfil">

            <!-- FOTO DE PERFIL -->

            <div class="foto-perfil">

                {% if usuario[5] %}

                    <img
                        src="{{ url_for('static', filename='imagens/perfis/' + usuario[5]) }}"
                        width="150"
                    >

                {% else %}

                    <div class="foto-vazia">
                        👤
                    </div>

                {% endif %}

                <label for="foto">Alterar foto</label>

            </div>


            <!-- INFORMAÇÕES -->

            <form
                action="/perfil"
                method="POST"
                enctype="multipart/form-data"
            >

                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ usuario[1] }}"
                    required
                >


                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ usuario[2] }}"
                    required
                >


                <label for="senha">Nova senha:</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite uma nova senha"
                >


                <label for="foto">Foto de perfil:</label>

                <input
                    type="file"
                    id="foto"
                    name="foto"
                    accept="image/*"
                >


                <button type="submit">
                    Salvar alterações
                </button>

            </form>

        </div>

    </main>

</body>

</html>
```
